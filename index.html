<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <title>Лабораторна робота №3 — Варіант 4</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 600px;
      margin: 40px auto;
      padding: 0 15px;
    }

    .controls {
      margin-bottom: 20px;
      display: flex;
      gap: 10px;
      align-items: center;
    }

    input {
      width: 100px;
      padding: 6px;
    }

    button {
      padding: 6px 14px;
      cursor: pointer;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th, td {
      border: 1px solid #ccc;
      padding: 8px 12px;
      text-align: center;
    }

    thead tr {
      background-color: #2c3e50;
      color: #ffffff;
    }

    tbody tr:nth-child(odd) {
      background-color: #ffffff;
    }

    tbody tr:nth-child(even) {
      background-color: #eaf2f8;
    }
  </style>
</head>
<body>

  <div class="controls">
    <label for="interval">Інтервал (мс):</label>
    <input type="number" id="interval" value="1000" min="100" step="100">
    <button id="startBtn">Старт</button>
    <button id="stopBtn" disabled>Стоп</button>
  </div>

  <table id="dataTable" hidden>
    <thead>
      <tr>
        <th>Час</th>
        <th>Число</th>
        <th>Статус</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <script src="script.js"></script>
</body>
</html>
